<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Private Response Dashboard 💗</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px;
      min-height: 100vh;
      background: #fff7fb;
      color: #5b3550;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 850px;
      margin: auto;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 20px;
      border: 1px solid #fbcfe8;
      box-shadow: 0 10px 35px rgba(219, 39, 119, 0.1);
      margin-bottom: 20px;
    }

    h1 {
      color: #db2777;
      text-align: center;
    }

    input {
      display: block;
      width: 100%;
      padding: 13px;
      margin: 12px 0;
      border: 1px solid #fbcfe8;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 25px;
      background: #ec4899;
      color: white;
      cursor: pointer;
      font-size: 15px;
      margin: 5px;
    }

    button:hover {
      background: #db2777;
    }

    .hidden {
      display: none;
    }

    .response {
      padding: 18px;
      margin: 15px 0;
      background: #fff7fb;
      border-left: 5px solid #ec4899;
      border-radius: 10px;
    }

    .response p {
      margin: 8px 0;
      line-height: 1.6;
    }

    .error {
      color: #dc2626;
    }

    .success {
      color: #16a34a;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
  </style>
</head>

<body>

  <main class="container">

    <section class="box" id="login-box">
      <h1>Meet's Private Dashboard 💗</h1>

      <p>
        Sirf authorized account se login karke responses dekhe ja sakte hain.
      </p>

      <form id="login-form">
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        >

        <button type="submit">Login 🔐</button>
      </form>

      <p id="login-message"></p>
    </section>

    <section class="box hidden" id="dashboard-box">

      <div class="top-bar">
        <h1>Responses 💌</h1>
        <button id="logout-btn">Logout</button>
      </div>

      <p id="user-email"></p>

      <button id="refresh-btn">Refresh Responses 🔄</button>

      <p id="dashboard-message"></p>

      <div id="responses-container"></div>

    </section>

  </main>

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      getDocs
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAPO4Fj_ZGcA-CVYo2IWOr4Tc49WlFx5A8",
      authDomain: "ridhima-proposal.firebaseapp.com",
      projectId: "ridhima-proposal",
      storageBucket: "ridhima-proposal.firebasestorage.app",
      messagingSenderId: "7466157324",
      appId: "1:7466157324:web:111ce1a1032b1d8b383529",
      measurementId: "G-V6WBB754SY"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loginBox = document.getElementById("login-box");
    const dashboardBox = document.getElementById("dashboard-box");

    const loginForm = document.getElementById("login-form");
    const loginMessage = document.getElementById("login-message");

    const userEmail = document.getElementById("user-email");
    const dashboardMessage = document.getElementById("dashboard-message");

    const responsesContainer = document.getElementById("responses-container");

    const logoutButton = document.getElementById("logout-btn");
    const refreshButton = document.getElementById("refresh-btn");

    loginForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      loginMessage.textContent = "Logging in...";

      try {
        await signInWithEmailAndPassword(auth, email, password);
        loginMessage.textContent = "";
      } catch (error) {
        console.error("Login error:", error);
        loginMessage.className = "error";
        loginMessage.textContent =
          "Login failed. Email ya password check karo.";
      }
    });

    onAuthStateChanged(auth, async function (user) {
      if (user) {
        loginBox.classList.add("hidden");
        dashboardBox.classList.remove("hidden");

        userEmail.textContent = "Logged in as: " + user.email;

        await loadResponses();
      } else {
        loginBox.classList.remove("hidden");
        dashboardBox.classList.add("hidden");
      }
    });

    async function loadResponses() {
      responsesContainer.innerHTML = "";
      dashboardMessage.textContent = "Loading responses...";

      try {
        const snapshot = await getDocs(
          collection(db, "responses")
        );

        if (snapshot.empty) {
          responsesContainer.innerHTML =
            "<p>Abhi tak koi response nahi mila. 💗</p>";

          dashboardMessage.textContent = "";
          return;
        }

        const responses = [];

        snapshot.forEach(function (doc) {
          responses.push({
            id: doc.id,
            ...doc.data()
          });
        });

        responses.sort(function (a, b) {
          const timeA = a.createdAt?.toMillis
            ? a.createdAt.toMillis()
            : 0;

          const timeB = b.createdAt?.toMillis
            ? b.createdAt.toMillis()
            : 0;

          return timeA - timeB;
        });

        responses.forEach(function (data, index) {
          const responseBox = document.createElement("div");
          responseBox.className = "response";

          const question = document.createElement("p");
          question.innerHTML =
            "<strong>Question:</strong> " +
            escapeHTML(data.question || "Not available");

          const answer = document.createElement("p");
          answer.innerHTML =
            "<strong>Answer:</strong> " +
            escapeHTML(data.answer || "Not available");

          const number = document.createElement("p");
          number.innerHTML =
            "<strong>Response:</strong> " + (index + 1);

          responseBox.appendChild(number);
          responseBox.appendChild(question);
          responseBox.appendChild(answer);

          responsesContainer.appendChild(responseBox);
        });

        dashboardMessage.textContent =
          "Total responses: " + responses.length;

      } catch (error) {
        console.error("Loading responses error:", error);

        dashboardMessage.className = "error";
        dashboardMessage.textContent =
          "Responses load nahi ho paaye. Firebase rules check karo.";
      }
    }

    function escapeHTML(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    refreshButton.addEventListener("click", loadResponses);

    logoutButton.addEventListener("click", async function () {
      await signOut(auth);
    });

  </script>

</body>
</html>
